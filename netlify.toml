[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

# Redirigir los recursos del frontend cuando se accede desde la raiz (/)
[[redirects]]
  from = "/styles.css"
  to = "/web/styles.css"
  status = 200

[[redirects]]
  from = "/app.js"
  to = "/web/app.js"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/web/assets/:splat"
  status = 200

# Redirigir la raiz directamente al buscador interactivo
[[redirects]]
  from = "/"
  to = "/web/index.html"
  status = 200

# Redirigir la API de inmuebles al JSON estatico del catalogo
[[redirects]]
  from = "/api/properties"
  to = "/data/inmuebles_barranquilla.json"
  status = 200

# Redirigir el endpoint de tracking compartido a la serverless function
[[redirects]]
  from = "/api/tracking"
  to = "/.netlify/functions/tracking"
  status = 200
